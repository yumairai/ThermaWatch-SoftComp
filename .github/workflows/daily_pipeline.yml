name: ThermaWatch Daily Data Pipeline

on:
  schedule:
    # Berjalan otomatis setiap hari pukul 18:00 UTC (atau pukul 01:00 WIB dini hari)
    - cron: '0 18 * * *'
  workflow_dispatch: # Memungkinkan Anda menjalankan pipeline ini secara manual lewat tombol di GitHub Web

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    # 1. Unduh kode project dari repository ke runner GitHub
    - name: Checkout Repository
      uses: actions/checkout@v3

    # 2. Siapkan Python versi 3.11 di server runner
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # 3. Cache Python packages untuk mempercepat proses build berikutnya
    - name: Cache Pip Dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # 4. Install semua library dari requirements.txt
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 5. Rekonstruksi file credentials.json secara temporer dari GitHub Secrets
    - name: Setup Credentials File
      run: |
        mkdir -p backend/config
        echo '${{ secrets.GCP_SERVICE_ACCOUNT }}' > backend/config/credentials.json

    # 6. Jalankan Script Pipeline Utama
    - name: Run Pipeline Script
      run: |
        PYTHONPATH=backend python -m pipeline.run_daily_pipeline

    # 7. Commit & Push perubahan database lokal (CSV) kembali ke repository GitHub Anda
    - name: Commit and Push Updated Local CSV Database
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data/Dataset_Master_ERA5_Ready_LSTM.csv "data/Dataset_Master_Modis_Ready_LSTM.csv"
        git commit -m "chore: auto-update local databases (ERA5 & MODIS) for $(date +'%Y-%m-%d')" || exit 0
        git pull --rebase https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
        git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
